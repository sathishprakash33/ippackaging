<div class="shell">
  <header class="bar">
    <a class="brand" routerLink="/">
      <app-brand-logo [size]="42" />
      <span>
        <strong>LP PACKAGING</strong>
        <small>Admin desk</small>
      </span>
    </a>

    <nav class="tabs" aria-label="Admin">
      <a routerLink="/admin/products" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z" />
        </svg>
        Products
      </a>
      <a routerLink="/admin/categories" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z" />
        </svg>
        Categories
      </a>
      <a routerLink="/admin/orders" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zM7.16 14h9.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0021.07 5H5.21L4.27 2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7.42a.25.25 0 01-.25-.25l.03-.12.7-1.26h.26z" />
        </svg>
        Orders
      </a>
      <a routerLink="/admin/courier" routerLinkActive="is-active">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M20 8h-3V4H3v13h2a3 3 0 006 0h4a3 3 0 006 0h1v-5l-2-4zM8 18a1 1 0 110-2 1 1 0 010 2zm11 0a1 1 0 110-2 1 1 0 010 2zm-1-6h-2.2l1.2-2.4V12z" />
        </svg>
        Courier
      </a>
    </nav>

    <div class="who">
      <span>{{ username() }}</span>
      <button type="button" (click)="logout()">Log out</button>
    </div>
  </header>
  <router-outlet />
</div>
